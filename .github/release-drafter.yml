---
# Release Drafter - Auto-generate release notes
# See: https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION 🌟'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR @$PULL_REQUEST'
categories:
  - title: '🚀 Features'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '⚡ Performance'
    labels:
      - 'perf'
      - 'performance'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'documentation'
  - title: '🔒 Security'
    labels:
      - 'security'
version-resolver:
  major:
    labels:
      - 'breaking-change'
      - 'major'
  minor:
    labels:
      - 'feat'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bugfix'
      - 'perf'