openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: VoiceFlow AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: settings
    description: Organization settings
  - name: integrations
    description: Third-party integrations management
  - name: health
    description: Health operations
  - name: agents
    description: AI phone agent management
  - name: calls
    description: Call history and details
  - name: dashboard
    description: Dashboard stats and summaries
  - name: billing
    description: Billing and subscription management
  - name: webhooks
    description: Inbound webhook handlers
  - name: agent-config
    description: Agent configuration helpers (voices, prompt templates)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ──────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found

    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/activate:
    post:
      operationId: activateAgent
      tags: [agents]
      summary: Activate agent (deploy to Vapi)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}/deactivate:
    post:
      operationId: deactivateAgent
      tags: [agents]
      summary: Deactivate agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  # ── Calls ────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List calls with optional filter
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get call detail with transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  # ── Dashboard ────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-calls:
    get:
      operationId: getRecentCalls
      tags: [dashboard]
      summary: Get recent calls for dashboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /dashboard/call-volume:
    get:
      operationId: getCallVolume
      tags: [dashboard]
      summary: Get call volume by day (last 30 days)
      responses:
        "200":
          description: Call volume data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallVolumeDay"

  /dashboard/agent-performance:
    get:
      operationId: getAgentPerformance
      tags: [dashboard]
      summary: Get performance metrics per agent
      responses:
        "200":
          description: Per-agent performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentPerformance"

  # ── Billing ───────────────────────────────────────────
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: Get available billing plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPlan"

  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Create Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"

  /billing/usage:
    get:
      operationId: getBillingUsage
      tags: [billing]
      summary: Get current billing usage
      responses:
        "200":
          description: Usage info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"

  # ── Settings ───────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get organization settings
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
    post:
      operationId: updateSettings
      tags: [settings]
      summary: Update organization settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"

  # ── Integrations ───────────────────────────────────────
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List available integrations
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
  /integrations/google/status:
    get:
      operationId: getGoogleIntegrationStatus
      tags: [integrations]
      summary: Check Google Calendar connection status
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleIntegrationStatus"

  # ── Agent Config ───────────────────────────────────────
  /agent-config/voices:
    get:
      operationId: listVoices
      tags: [agent-config]
      summary: List available TTS voices
      responses:
        "200":
          description: Voice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"
  /agent-config/prompts:
    get:
      operationId: getPromptTemplates
      tags: [agent-config]
      summary: Get prompt templates, optionally filtered by agent type
      parameters:
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Prompt template(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PromptTemplate"
                  - type: object
                    additionalProperties:
                      type: string

  # ── Webhooks ────────────────────────────────────────────
  /webhooks/vapi:
    post:
      operationId: vapiWebhook
      tags: [webhooks]
      summary: Receive Vapi call events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiEventPayload"
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [booking, advisory, hr_screening, hr_onboarding]
        status:
          type: string
          enum: [active, inactive, draft]
        phoneNumber:
          type: ["string", "null"]
        voiceId:
          type: ["string", "null"]
        voiceName:
          type: ["string", "null"]
        language:
          type: string
        systemPrompt:
          type: string
        businessName:
          type: ["string", "null"]
        businessHoursOpen:
          type: ["string", "null"]
        businessHoursClose:
          type: ["string", "null"]
        timezone:
          type: string
        totalCalls:
          type: integer
        totalMinutes:
          type: number
        resolutionRate:
          type: number
        vapiAssistantId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - type
        - status
        - language
        - systemPrompt
        - timezone
        - totalCalls
        - totalMinutes
        - resolutionRate
        - createdAt
        - updatedAt

    AgentInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [booking, advisory, hr_screening, hr_onboarding]
        businessName:
          type: string
        businessHoursOpen:
          type: string
        businessHoursClose:
          type: string
        timezone:
          type: string
        voiceId:
          type: string
        voiceName:
          type: string
        language:
          type: string
        systemPrompt:
          type: string
      required:
        - name
        - type
        - systemPrompt

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]
        businessName:
          type: string
        businessHoursOpen:
          type: string
        businessHoursClose:
          type: string
        voiceId:
          type: string
        voiceName:
          type: string
        language:
          type: string
        systemPrompt:
          type: string

    Call:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        callerNumber:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
          enum: [queued, in_progress, completed, failed, no_answer]
        durationSeconds:
          type: integer
        resolved:
          type: boolean
        resolutionType:
          type: ["string", "null"]
        escalatedToHuman:
          type: boolean
        transcript:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        sentiment:
          type: ["string", "null"]
          enum: [positive, neutral, negative, "null"]
        startedAt:
          type: ["string", "null"]
        endedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - direction
        - status
        - durationSeconds
        - resolved
        - escalatedToHuman
        - createdAt

    DashboardStats:
      type: object
      properties:
        totalCallsToday:
          type: integer
        totalCallsThisMonth:
          type: integer
        avgDurationSeconds:
          type: number
        resolutionRate:
          type: number
        bookingsThisMonth:
          type: integer
        activeAgents:
          type: integer
        minutesUsed:
          type: integer
        minutesIncluded:
          type: integer
      required:
        - totalCallsToday
        - totalCallsThisMonth
        - avgDurationSeconds
        - resolutionRate
        - bookingsThisMonth
        - activeAgents
        - minutesUsed
        - minutesIncluded

    CallVolumeDay:
      type: object
      properties:
        date:
          type: string
        calls:
          type: integer
        resolved:
          type: integer
      required:
        - date
        - calls
        - resolved

    AgentPerformance:
      type: object
      properties:
        agentId:
          type: string
        agentName:
          type: string
        totalCalls:
          type: integer
        resolutionRate:
          type: number
        avgDurationSeconds:
          type: number
        status:
          type: string
      required:
        - agentId
        - agentName
        - totalCalls
        - resolutionRate
        - avgDurationSeconds
        - status

    BillingPlan:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        priceEuros:
          type: number
        minutes:
          type: integer
        maxAgents:
          type: integer
        features:
          type: array
          items:
            type: string
      required:
        - key
        - name
        - priceEuros
        - minutes
        - maxAgents
        - features

    CheckoutInput:
      type: object
      properties:
        planKey:
          type: string
        email:
          type: string
      required:
        - planKey
        - email

    CheckoutResult:
      type: object
      properties:
        checkoutUrl:
          type: string
      required:
        - checkoutUrl

    BillingUsage:
      type: object
      properties:
        plan:
          type: string
        minutesUsed:
          type: integer
        minutesIncluded:
          type: integer
        subscriptionStatus:
          type: string
        billingCycleStart:
          type: ["string", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
      required:
        - plan
        - minutesUsed
        - minutesIncluded
        - subscriptionStatus

    VapiEventPayload:
      type: object
      properties:
        message:
          type: object

    OrganizationSettings:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        timezone:
          type: string
        language:
          type: string
        vapiConfigured:
          type: boolean
        elevenLabsConfigured:
          type: boolean
        googleCalendarConnected:
          type: boolean
      required:
        - id
        - name
        - email
        - timezone
        - language
        - vapiConfigured
        - elevenLabsConfigured
        - googleCalendarConnected
    UpdateSettingsInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        timezone:
          type: string
        language:
          type: string
        vapiKey:
          type: string
        elevenLabsKey:
          type: string
      required: []
    Integration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [connected, available, coming-soon, disconnected]
        connectedAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - status
    GoogleIntegrationStatus:
      type: object
      properties:
        connected:
          type: boolean
        agentId:
          type: ["string", "null"]
      required:
        - connected
    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
      required:
        - received
    Voice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
    PromptTemplate:
      type: object
      properties:
        type:
          type: string
        prompt:
          type: string
      required:
        - type
        - prompt
