services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6543:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voiceflow
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
