kind = "web"
previewPath = "/"
title = "VoiceFlow AI"
version = "1.0.0"
id = "artifacts/voiceflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25332

[services.development]
run = "pnpm --filter @workspace/voiceflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voiceflow", "run", "build" ]
publicDir = "artifacts/voiceflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25332"
BASE_PATH = "/"
